<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Willow Melodies 04 · September Good Things</title><style>body{font-family:system-ui,sans-serif;background:#10202b;color:#eef7fb;max-width:1000px;margin:auto;padding:24px}h1{color:#9ed8ef}.box,.card{background:#183241;border:1px solid #365668;border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}textarea{width:100%;min-height:280px;background:#0d1a23;color:#eef7fb;border:1px solid #365668;border-radius:8px;padding:12px;line-height:1.6}button{padding:8px 12px;border:0;border-radius:7px;background:#9ed8ef;color:#10202b;font-weight:700;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h1>Willow Melodies 04 · September Good Things · 15곡</h1><div class="box"><b>주제 분석</b><p>참고 영상의 핵심은 9월의 새 출발과 잘될 것 같은 예감, 청량하고 신나는 팝송, 카페·노동요로 오래 틀어두기 좋은 흐름입니다.</p><p>새 플리는 이 분위기만 참고해 만든 오리지널 영어 팝입니다. 96–116 BPM, 어쿠스틱 기타·피아노·탄력 있는 베이스·맑은 드럼을 섞고, 아침에서 오후로 밝아지는 15곡 곡선을 구성했습니다.</p></div><div id="app"></div><script>const titles=['September Starts','Good Things Are Near','Green Light Morning','Lucky in the Little Things','Open Window Season','Today Has My Back','Clear Skies Ahead','Coffee and a New Plan','Make Room for Better','Bright Side of the Street','One Step Into September','Feeling Like a Fresh Start','Keep the Good Going','A Little More Possible','We Are Going Somewhere'];const hooks=['September starts, and I can feel the whole world turn','Good things are near, I can hear them in the air','Green light morning, I am ready for the road','Lucky in the little things, lucky to be alive','Open window season, let the brighter weather in','Today has my back, I can take it as it comes','Clear skies ahead, every cloud is moving on','Coffee and a new plan, let the day begin','Make room for better, let the old weight go','Bright side of the street, that is where I want to be','One step into September, one step into a brand-new song','Feeling like a fresh start, feeling light and strong','Keep the good going, let the small joy grow','A little more possible with every open door','We are going somewhere, and the road is gold'];const bpms=[104,108,112,100,106,98,110,102,114,108,100,106,112,104,116];const voc=['여성','남성','여성','남성','여성','여성','남성','여성','남성','여성','남성','여성','여성','남성','여성'];function lyrics(t,h){return '[Intro]\\n'+t+'\\n'+h+'\\n\\n[Verse 1]\\nThe calendar turns a brighter page\\nI feel a new wind on the stage\\nYesterday can take its time\\nI am stepping into better skies\\nEvery small sign says begin\\nThere is a quiet hope within\\nI take a breath, I take a chance\\nAnd let the morning lead the dance\\n\\n[Pre-Chorus]\\nNo need to know the final line\\nI only need this moment shining\\n\\n[Chorus]\\n'+h+'\\nLet the rhythm lift me higher\\nEvery little yes becomes a fire\\nI can feel the future moving near\\n'+t+', this is my year\\n\\n[Verse 2]\\nA cup of coffee, open road\\nI choose the lightest way to go\\nThe city hums a friendly tune\\nAnd hope arrives before noon\\nI leave some space for something new\\nFor kind surprises coming through\\nWith every mile and every smile\\nI know I am in place awhile\\n\\n[Pre-Chorus]\\nNo need to know the final line\\nI only need this moment shining\\n\\n[Chorus]\\n'+h+'\\nLet the rhythm lift me higher\\nEvery little yes becomes a fire\\nI can feel the future moving near\\n'+t+', this is my year\\n\\n[Bridge]\\nIf the plan changes, I will bend\\nA different road can still be friend\\nI will keep my heart awake\\nFor every good turn I can take\\n\\n[Instrumental Break]\\n(Bright guitar, piano, melodic bass and crisp live drums)\\n\\n[Final Chorus]\\n'+h+'\\nLet the rhythm lift me higher\\nEvery little yes becomes a fire\\nI can feel the future moving near\\n'+t+', this is my year\\n'+h+'\\nI am ready, I am ready\\n\\n[Outro]\\n'+t+'\\nGood things are near';}const styles=['Bright contemporary indie pop, clear female lead, '+bpms[0]+' BPM, acoustic guitar, piano, melodic bass, crisp live drums, hand percussion and airy backing vocals. Fresh September optimism, catchy chorus, polished organic mix, full three-minute-plus arrangement.','Uplifting soft pop, warm male lead, '+bpms[1]+' BPM, clean guitar, Rhodes, rounded bass, light drums and subtle harmonies. Sunny café energy, memorable hook, full three-minute-plus arrangement.'];const app=document.getElementById('app');titles.forEach((t,i)=>{const c=document.createElement('section');c.className='card';c.innerHTML='<h2>'+String(i+1).padStart(2,'0')+' · '+t+'</h2><p><b>Hook:</b> '+hooks[i]+' · '+bpms[i]+' BPM · '+voc[i]+' 보컬</p><div class="grid"><div><b>가사</b><textarea readonly>'+lyrics(t,hooks[i])+'</textarea></div><div><b>Styles</b><textarea readonly>'+styles[i%2].replace(bpms[i%2],bpms[i])+'</textarea><p><b>Exclude:</b> rap, trap, EDM drop, heavy rock, sad ballad, excessive reverb, humming, wordless vocals, choir</p><button onclick="navigator.clipboard.writeText(this.parentElement.parentElement.innerText)">현재 곡 복사</button></div></div></section>';app.appendChild(c)});</script></body></html>
