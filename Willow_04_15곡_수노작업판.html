<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Willow Melodies 04 · September Good Things</title><style>body{font-family:system-ui,sans-serif;background:#10202b;color:#eef7fb;max-width:1050px;margin:auto;padding:24px}h1{color:#9ed8ef}.box,.card{background:#183241;border:1px solid #365668;border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}textarea{width:100%;min-height:300px;background:#0d1a23;color:#eef7fb;border:1px solid #365668;border-radius:8px;padding:12px;line-height:1.6}button{padding:8px 12px;border:0;border-radius:7px;background:#9ed8ef;color:#10202b;font-weight:700;cursor:pointer}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.dots{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}.dots button{background:#183241;color:#9ab0bc;border:1px solid #365668}.dots .on{background:#9ed8ef;color:#10202b}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h1>Willow Melodies 04 · September Good Things · 15곡</h1><div class="box"><b>주제</b><p>9월의 새 출발과 잘될 것 같은 예감, 청량하고 신나는 영어 팝송. 카페음악·노동요로 오래 틀어두기 좋은 오리지널 플리입니다.</p></div><div id="app"></div><script>const songs=[['September Starts','September starts, and I can feel the whole world turn',104,'여성'],['Good Things Are Near','Good things are near, I can hear them in the air',108,'남성'],['Green Light Morning','Green light morning, I am ready for the road',112,'여성'],['Lucky in the Little Things','Lucky in the little things, lucky to be alive',100,'남성'],['Open Window Season','Open window season, let the brighter weather in',106,'여성'],['Today Has My Back','Today has my back, I can take it as it comes',98,'여성'],['Clear Skies Ahead','Clear skies ahead, every cloud is moving on',110,'남성'],['Coffee and a New Plan','Coffee and a new plan, let the day begin',102,'여성'],['Make Room for Better','Make room for better, let the old weight go',114,'남성'],['Bright Side of the Street','Bright side of the street, that is where I want to be',108,'여성'],['One Step Into September','One step into September, one step into a brand-new song',100,'남성'],['Feeling Like a Fresh Start','Feeling like a fresh start, feeling light and strong',106,'여성'],['Keep the Good Going','Keep the good going, let the small joy grow',112,'여성'],['A Little More Possible','A little more possible with every open door',104,'남성'],['We Are Going Somewhere','We are going somewhere, and the road is gold',116,'여성']];let i=0,done=JSON.parse(localStorage.getItem('willow04_done')||'[]');const app=document.getElementById('app');const ex='rap, trap, EDM drop, heavy rock, sad ballad, excessive reverb, humming, wordless vocals, choir';function makeLyrics(t,h){return ['[Intro]',t,h,'','[Verse 1]','The calendar turns a brighter page','I feel a new wind on the stage','Yesterday can take its time','I am stepping into better skies','Every small sign says begin','There is a quiet hope within','I take a breath, I take a chance','And let the morning lead the dance','','[Pre-Chorus]','No need to know the final line','I only need this moment shining','','[Chorus]',h,'Let the rhythm lift me higher','Every little yes becomes a fire','I can feel the future moving near',t+', this is my year','','[Verse 2]','A cup of coffee, open road','I choose the lightest way to go','The city hums a friendly tune','And hope arrives before noon','I leave some space for something new','For kind surprises coming through','With every mile and every smile','I know I am in place awhile','','[Pre-Chorus]','No need to know the final line','I only need this moment shining','','[Chorus]',h,'Let the rhythm lift me higher','Every little yes becomes a fire','I can feel the future moving near',t+', this is my year','','[Bridge]','If the plan changes, I will bend','A different road can still be friend','I will keep my heart awake','For every good turn I can take','','[Instrumental Break]','(Bright guitar, piano, melodic bass and crisp live drums)','','[Final Chorus]',h,'Let the rhythm lift me higher','Every little yes becomes a fire','I can feel the future moving near',t+', this is my year','','[Outro]',t,'Good things are near'].join('\n')}function style(b,v){return 'Bright contemporary indie pop, '+(v==='여성'?'clear female':'warm male')+' lead vocal, '+b+' BPM, acoustic guitar, piano, melodic bass, crisp live drums, hand percussion and airy backing vocals. Fresh September optimism, catchy chorus, polished organic mix, full three-minute-plus arrangement.'}function cp(x,b){navigator.clipboard.writeText(x);b.textContent='복사됨!';setTimeout(()=>b.textContent='복사',700)}function render(){let s=songs[i],t=s[0],h=s[1],b=s[2],v=s[3];app.innerHTML='<div class="nav"><button id="p">◀ 이전 곡</button><div class="dots">'+songs.map((_,n)=>'<button class="'+(n===i?'on':'')+'" data-n="'+n+'">'+(n+1)+'</button>').join('')+'</div><button id="n">다음 곡 ▶</button></div><section class="card"><h2>'+(i+1)+' · '+t+'</h2><p>'+b+' BPM · '+v+' 보컬 · 청량한 9월 팝</p><p><b>Hook:</b> '+h+'</p><label>① 가사 <button id="cl">복사</button></label><textarea readonly>'+makeLyrics(t,h)+'</textarea><label>② Styles <button id="cs">복사</button></label><textarea readonly>'+style(b,v)+'</textarea><label>③ Exclude <button id="ce">복사</button></label><input id="e" readonly value="'+ex+'"><label>④ WAV 파일명</label><input readonly value="'+String(i+1).padStart(2,'0')+' '+t+'.wav"><label><input id="d" type="checkbox" '+(done.includes(i)?'checked':'')+'> 완료</label></section>';document.querySelectorAll('[data-n]').forEach(x=>x.onclick=()=>{i=+x.dataset.n;render()});p.onclick=()=>{if(i){i--;render()}};n.onclick=()=>{if(i<14){i++;render()}};d.onchange=()=>{if(d.checked&&!done.includes(i))done.push(i);if(!d.checked)done=done.filter(x=>x!==i);localStorage.setItem('willow04_done',JSON.stringify(done));render()};cl.onclick=e=>cp(makeLyrics(t,h),e.target);cs.onclick=e=>cp(style(b,v),e.target);ce.onclick=e=>cp(ex,e.target)}render();</script></body></html>
